[package]
name = "mail-canon"
version = "0.2.0"
edition = "2021"
description = "A simple package to normalize and canonicalise email addresses across Gmail, Outlook, Yahoo, and more, by the irondome.dev team."
license = "MIT"
readme = "README.md"
repository = "https://github.com/IrondomeDev/mail-canon"
homepage = "https://github.com/IrondomeDev/mail-canon"
documentation = "https://docs.rs/mail-canon"
keywords = ["email", "normalization", "canonicalization", "idna"]
categories = ["email", "text-processing"]
include = ["src/**", "Cargo.toml", "README.md", "API.md", "LICENSE"]

[lib]
name = "mail_canon"

[dependencies]
idna = "1.1.0"
