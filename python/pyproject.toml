[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mail-canon"
version = "0.2.0"
description = "A simple package to normalize and canonicalise email addresses across Gmail, Outlook, Yahoo, and more, by the irondome.dev team."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Iron Dome"}]
dependencies = ["idna>=3.15,<4"]

[project.urls]
Repository = "https://github.com/IrondomeDev/mail-canon"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mail_canon = ["py.typed"]

[tool.setuptools.data-files]
"share/doc/mail-canon" = ["API.md"]
