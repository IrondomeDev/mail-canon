name: Publish Rust

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed crate version to publish
        required: true
        default: '0.2.0'
        type: string
      publish:
        description: Publish the tested crate to crates.io
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-crates
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Check reviewed version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python3 -c 'import os,tomllib; assert tomllib.load(open("Cargo.toml","rb"))["package"]["version"] == os.environ["EXPECTED_VERSION"], "Version differs from reviewed release"'
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component clippy
      - name: Test
        run: cargo +stable test
      - name: Lint
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Package and verify
        run: cargo +stable package --locked
      - name: crates.io trusted login
        if: inputs.publish
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - name: Publish
        if: inputs.publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo +stable publish --locked
