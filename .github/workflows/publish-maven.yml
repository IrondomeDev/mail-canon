name: Publish Maven

on:
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed Maven version to publish
        required: true
        default: '0.2.0'
        type: string
      publish:
        description: Sign and publish the tested artifacts to Maven Central
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-maven
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: maven-central
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ inputs.publish && secrets.MAVEN_GPG_PRIVATE_KEY || '' }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - name: Check reviewed version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: python3 -c 'import os,xml.etree.ElementTree as E; p=E.parse("pom.xml").getroot(); assert p.find("{http://maven.apache.org/POM/4.0.0}version").text == os.environ["EXPECTED_VERSION"], "Version differs from reviewed release"'
      - name: Install verified Maven 3.9.16
        run: |
          archive="$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          curl --fail --silent --show-error --location https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz --output "$archive"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Verify
        if: ${{ !inputs.publish }}
        run: mvn --batch-mode verify
      - name: Check signer and credentials
        if: inputs.publish
        env:
          EXPECTED_SIGNER: ${{ vars.MAVEN_SIGNING_FINGERPRINT }}
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          test -n "$CENTRAL_USERNAME"
          test -n "$CENTRAL_PASSWORD"
          test -n "$MAVEN_GPG_PASSPHRASE"
          python3 -c 'import os,subprocess; expected=os.environ["EXPECTED_SIGNER"]; assert len(expected)==40; rows=subprocess.check_output(["gpg","--batch","--with-colons","--list-secret-keys",expected],text=True); assert any(r.startswith("fpr:") and r.split(":")[9]==expected for r in rows.splitlines()), "Unexpected signing key"'
      - name: Sign and publish
        if: inputs.publish
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode -Prelease deploy
