name: Publish NuGet

on:
  workflow_dispatch:
    inputs:
      nuget_user:
        description: Personal NuGet profile username that created the trusted policy
        required: true
        type: string
      publish:
        description: Publish the tested package to NuGet.org
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet run --project csharp/tests/MailCanon.Tests.csproj -c Release
      - name: Pack
        run: dotnet pack csharp/src/MailCanon.csproj -c Release -o artifacts
      - name: NuGet login
        if: inputs.publish
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: login
        with:
          user: ${{ inputs.nuget_user }}
      - name: Publish
        if: inputs.publish
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
